[project]
name = "mit-ai-multiagentsys"
version = "0.1.0"
description = "Controlled multi-agent enterprise onboarding and verification simulator"
readme = "README.md"
authors = [
    { name = "Sidramappa Potdar", email = "126233261+sidrampotdar@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "google-genai>=2.34.0",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.30.0",
]

[project.scripts]
mit-ai-multiagentsys = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


